<svg xmlns="http://w3.org" viewBox="0 0 800 350" width="100%" height="100%" style="background:#0d0d0d;">
  <style>
    /* Мерцание черепа */
    @keyframes neon-flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        fill: #ff0000;
        filter: drop-shadow(0 0 2px #ff0000) drop-shadow(0 0 8px #ff0000);
        opacity: 1;
      }
      20%, 24%, 55% {
        fill: #2a0000;
        filter: none;
        opacity: 0.3;
      }
    }
    /* Падение цифр */
    @keyframes matrix-fall {
      0% { transform: translateY(-120px); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    .glitch-skull { animation: neon-flicker 3s infinite alternate; }
    .matrix-text { font-family: 'Courier New', monospace; font-size: 15px; font-weight: bold; fill: #500000; }
    .bright-code { fill: #ff0000; filter: drop-shadow(0 0 1px #ff0000); }
    
    .col-1 { animation: matrix-fall 4s infinite linear; animation-delay: 0s; }
    .col-2 { animation: matrix-fall 5s infinite linear; animation-delay: 1.5s; }
    .col-3 { animation: matrix-fall 3.5s infinite linear; animation-delay: 0.7s; }
    .col-4 { animation: matrix-fall 6s infinite linear; animation-delay: 2.2s; }
    .col-5 { animation: matrix-fall 4.5s infinite linear; animation-delay: 1s; }
  </style>

  <!-- Задний фон кода (Матрица из ваших чисел) -->
  <g class="col-1" transform="translate(40, 0)">
    <text x="0" y="30" class="matrix-text">852</text><text x="0" y="60" class="matrix-text">5</text><text x="0" y="90" class="matrix-text">2</text><text x="0" y="150" class="matrix-text">852-5-2</text>
  </g>
  <g class="col-2" transform="translate(180, 0)">
    <text x="0" y="20" class="matrix-text">5</text><text x="0" y="50" class="matrix-text">2</text><text x="0" y="80" class="matrix-text bright-code">852</text><text x="0" y="140" class="matrix-text">5</text>
  </g>
  <g class="col-3" transform="translate(300, 0)">
    <text x="0" y="40" class="matrix-text">852-5-2</text><text x="0" y="100" class="matrix-text">2</text><text x="0" y="130" class="matrix-text">852</text>
  </g>
  <g class="col-4" transform="translate(620, 0)">
    <text x="0" y="15" class="matrix-text">2</text><text x="0" y="75" class="matrix-text">852</text><text x="0" y="105" class="matrix-text bright-code">852-5-2</text>
  </g>
  <g class="col-5" transform="translate(730, 0)">
    <text x="0" y="50" class="matrix-text">852</text><text x="0" y="80" class="matrix-text">5</text><text x="0" y="110" class="matrix-text">2</text>
  </g>

  <!-- Центр: Огромный мерцающий череп -->
  <g transform="translate(350, 90) scale(1.1)">
    <path class="glitch-skull" d="M50,15 C33,15 25,25 25,43 C25,53 28,60 33,65 L33,78 L43,78 L43,85 L57,85 L57,78 L67,78 L67,65 C72,60 75,53 75,43 C75,25 67,15 50,15 Z M38,48 C35,48 33,45 33,42 C33,39 35,36 38,36 C41,36 43,39 43,42 C43,45 41,48 38,48 Z M62,48 C59,48 57,45 57,42 C57,39 59,36 62,36 C65,36 67,39 67,42 C67,45 65,48 62,48 Z M46,65 L43,55 L57,55 L54,65 L46,65 Z" />
  </g>
</svg>
