  <!-- Центральный череп (мерцающий) -->
  <g transform="translate(400, 200)">
    <!-- Аура/свечение -->
    <circle cx="0" cy="0" r="100" fill="#ff0000" opacity="0.1">
      <animate attributeName="opacity" values="0.05; 0.15; 0.05" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Череп -->
    <g fill="#ff0000" opacity="0.9">
      <!-- Форма черепа (упрощённая) -->
      <path d="M -60, -40 
               C -60, -100, 60, -100, 60, -40 
               C 60, 0, 40, 20, 20, 30 
               L 20, 50 
               L -20, 50 
               L -20, 30 
               C -40, 20, -60, 0, -60, -40 Z" 
            stroke="#ff0000" stroke-width="2" fill="none" opacity="0.8" />
      
      <!-- Глаза -->
      <ellipse cx="-25" cy="-30" rx="12" ry="8" fill="#ff0000" opacity="0.9">
        <animate attributeName="opacity" values="0.9; 0.3; 0.9" dur="1.5s" repeatCount="indefinite" />
      </ellipse>
      <ellipse cx="25" cy="-30" rx="12" ry="8" fill="#ff0000" opacity="0.9">
        <animate attributeName="opacity" values="0.9; 0.3; 0.9" dur="1.5s" begin="0.7s" repeatCount="indefinite" />
      </ellipse>

      <!-- Нос -->
      <path d="M -5, -10 L 5, -10 L 0, 5 Z" fill="#ff0000" opacity="0.7" />

      <!-- Зубы -->
      <line x1="-15" y1="35" x2="15" y2="35" stroke="#ff0000" stroke-width="3" opacity="0.8" />
      <line x1="-10" y1="42" x2="-10" y2="48" stroke="#ff0000" stroke-width="2" opacity="0.7" />
      <line x1="0" y1="42" x2="0" y2="48" stroke="#ff0000" stroke-width="2" opacity="0.7" />
      <line x1="10" y1="42" x2="10" y2="48" stroke="#ff0000" stroke-width="2" opacity="0.7" />

      <!-- Мерцание всего черепа -->
      <animate attributeName="opacity" values="0.9; 0.4; 0.9; 0.6; 0.9" dur="0.8s" repeatCount="indefinite" />
    </g>
  </g>
